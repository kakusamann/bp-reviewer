name: One-time merged branch cleanup
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.repository == 'kakusamann/bp-reviewer'
    runs-on: ubuntu-latest
    steps:
      - name: Delete the two already-merged feature branches
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          for branch in "feat/blueprint-studio-visual-refresh" "feat/semantic-blueprint-ui-polish"; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/git/refs/heads/${branch}"
          done

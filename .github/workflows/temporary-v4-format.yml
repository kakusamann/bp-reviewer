name: Temporary v4 Ruff formatter
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-v4-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.6.9
      - run: python -m ruff format backend/src/bpreviewer/agent.py backend/src/bpreviewer/api.py backend/src/bpreviewer/evidence_tools.py backend/src/bpreviewer/relation_agent.py tests/test_evidence_tools.py tests/test_blueprint_jobs.py
      - run: python -m ruff check backend tests scripts
      - name: Commit formatting only
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bpreviewer/agent.py backend/src/bpreviewer/api.py backend/src/bpreviewer/evidence_tools.py backend/src/bpreviewer/relation_agent.py tests/test_evidence_tools.py tests/test_blueprint_jobs.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format v4 agent tools and progress API"
            git push origin HEAD:main
          fi

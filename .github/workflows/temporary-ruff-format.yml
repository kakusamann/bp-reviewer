name: Temporary Python formatter
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-ruff-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.6.9
      - run: python -m ruff format backend/src/bpreviewer/agent.py backend/src/bpreviewer/scanner.py tests/test_semantic_blueprint_ids.py
      - run: python -m ruff check backend/src/bpreviewer/agent.py backend/src/bpreviewer/scanner.py tests/test_semantic_blueprint_ids.py
      - name: Commit formatted Python source to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/src/bpreviewer/agent.py backend/src/bpreviewer/scanner.py tests/test_semantic_blueprint_ids.py
          if ! git diff --cached --quiet; then
            git commit -m "style: apply Ruff format to semantic graph fix"
            git push origin HEAD:main
          fi

name: One-time v4 test formatter
on:
  push:
    branches: [main]
    paths: [.github/workflows/temporary-v4-test-format.yml]
permissions:
  contents: write
jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.6.9
      - run: python -m ruff format tests/test_evidence_tools.py
      - run: python -m ruff check tests/test_evidence_tools.py
      - name: Commit formatted test
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/test_evidence_tools.py
          if ! git diff --cached --quiet; then
            git commit -m "style: format MiMo tool-call regression test"
            git push origin HEAD:main
          fi

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bpreviewer"
version = "0.1.0"
description = "Read-only project blueprints and proposed change requests"
requires-python = ">=3.10"
dependencies = ["fastapi==0.111.1", "pydantic==2.8.2", "uvicorn==0.30.6"]

[project.optional-dependencies]
dev = ["pytest==8.3.2", "httpx==0.27.2", "ruff==0.6.9"]

[project.scripts]
bpreviewer = "bpreviewer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
